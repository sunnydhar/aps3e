name: Build aPS3e

on:
  workflow_dispatch:
  push:
    branches:
      - main2

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 and CMake
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1"
          yes | sdkmanager --licenses

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Prepare build file
        run: cp app/build.gradle.bak app/build.gradle

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aps3e-release
          path: app/build/outputs/apk/release/*.apk
